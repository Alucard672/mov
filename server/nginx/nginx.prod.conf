worker_processes  1;
events { worker_connections  2048; }
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 200m;

    # 公共上游（nginx 容器访问宿主机）
    # film: film:3601
    # host services: 172.19.0.1:3602~3607

    # =========================
    # HTTP: ACME + 跳转 HTTPS
    # =========================
    server {
        listen       80 default_server;
        server_name  localhost 120.27.148.45 alucard.top www.alucard.top
                     api.alucard.top down.alucard.top
                     home.alucard.top ads.alucard.top ota.alucard.top
                     admin.alucard.top ops.alucard.top daily.alucard.top stats.alucard.top;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        location / {
            if ($host ~* "alucard\.top$") {
                return 301 https://$host$request_uri;
            }
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        # IP 直连保留旧 /api/
        location /api/ {
            if ($host ~* "alucard\.top$") {
                return 301 https://$host$request_uri;
            }
            proxy_pass http://film:3601/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header New-Token;
            add_header New-Token $upstream_http_new_token always;
            add_header Access-Control-Expose-Headers "New-Token,new-token" always;
        }
    }

    # =========================
    # HTTPS api：前台 SPA + App 网关
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  api.alucard.top alucard.top www.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        # --- App 短路径网关 ---
        location = /r {
            proxy_pass http://172.19.0.1:3605/r;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            client_max_body_size 20m;
            add_header Access-Control-Allow-Origin * always;
        }
        location = /d {
            proxy_pass http://172.19.0.1:3605/d;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            client_max_body_size 20m;
            add_header Access-Control-Allow-Origin * always;
        }
        location ^~ /f/ {
            proxy_pass http://172.19.0.1:3605;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            add_header Access-Control-Allow-Origin * always;
        }
        location = /health/r {
            proxy_pass http://172.19.0.1:3605/health/r;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin * always;
        }
        location = /e {
            proxy_pass http://172.19.0.1:3606/e;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Access-Control-Allow-Origin * always;
        }
        location ~ ^/t/([a-fA-F0-9]+)\.torrent$ {
            proxy_pass http://172.19.0.1:3603/app/magnet/$1.torrent;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_buffering on;
            add_header Access-Control-Allow-Origin * always;
        }

        # 片库 API 根路径（新 App：https://api.alucard.top/ 无需 /api/）
        location ~ ^/(index|navCategory|filmDetail|filmPlayInfo|searchFilm|filmClassify|filmClassifySearch|config/) {
            proxy_pass http://film:3601;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header New-Token;
            add_header New-Token $upstream_http_new_token always;
            add_header Access-Control-Expose-Headers "New-Token,new-token" always;
        }

        # 兼容旧 App / 旧书签
        location /api/ {
            proxy_pass http://film:3601/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header New-Token;
            add_header New-Token $upstream_http_new_token always;
            add_header Access-Control-Expose-Headers "New-Token,new-token" always;
        }

        location /proxy {
            proxy_pass http://172.19.0.1:3602;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 15s;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /app/magnet/ {
            proxy_pass http://172.19.0.1:3603;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_buffering on;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /app/ytdlp/ {
            proxy_pass http://172.19.0.1:3605;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            client_max_body_size 20m;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /app/stats/ {
            proxy_pass http://172.19.0.1:3606;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /app/daily/ {
            proxy_pass http://172.19.0.1:3607;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /ops/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /ops/index.html;
            add_header Cache-Control "no-cache";
        }

        # Web 前台 SPA（home 子域未就绪前仍挂在 api）
        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }
    }

    # =========================
    # HTTPS down：下载站 + OTA 过渡 + 运营页
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  down.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        # 首页 = 下载页
        location = / {
            root /usr/share/nginx/html;
            try_files /download/index.html =404;
        }

        # OTA 短路径（ota 子域 DNS 未配时的过渡）
        location = /v.json {
            alias /usr/share/nginx/html/app/version.json;
            default_type application/json;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin * always;
        }
        location = /latest.apk {
            alias /usr/share/nginx/html/app/latest.apk;
            default_type application/vnd.android.package-archive;
            add_header Access-Control-Allow-Origin * always;
        }

        # 下载计数后 302
        location = /get {
            proxy_pass http://172.19.0.1:3606/get;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /app/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            types { application/vnd.android.package-archive apk; }
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin * always;
        }

        # 旧 stats API 路径兼容
        location ^~ /app/stats/ {
            proxy_pass http://172.19.0.1:3606;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /app/daily/ {
            proxy_pass http://172.19.0.1:3607;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /ops/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /ops/index.html;
            add_header Cache-Control "no-cache";
        }

        location ^~ /download/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /download/index.html;
        }

        location ^~ /stats/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /stats/index.html;
        }

        # stats 看板 API 短路径（同域）
        location = /summary {
            proxy_pass http://172.19.0.1:3606/summary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /health {
            proxy_pass http://172.19.0.1:3606/health;
            proxy_set_header Host $host;
        }

        location ^~ /daily/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /daily/index.html;
        }

        # daily 页 XHR 短路径（页面在 /daily/ 时请求 /list 会打到根）
        # 若 daily 页用相对路径 /list，由此反代
        location = /list {
            proxy_pass http://172.19.0.1:3607/list;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /preview {
            proxy_pass http://172.19.0.1:3607/preview;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /register {
            proxy_pass http://172.19.0.1:3607/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /day {
            proxy_pass http://172.19.0.1:3607/day;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ^~ /ads/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /ads/index.html;
        }

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /download/index.html;
            index  index.html;
        }
    }
}
