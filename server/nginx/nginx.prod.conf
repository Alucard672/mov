worker_processes  1;
events { worker_connections  2048; }
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 200m;

    # =========================
    # HTTP: ACME + 跳转 HTTPS
    # =========================
    server {
        listen       80 default_server;
        server_name  localhost 120.27.148.45 alucard.top www.alucard.top
                     api.alucard.top down.alucard.top home.alucard.top
                     ads.alucard.top ota.alucard.top admin.alucard.top
                     ops.alucard.top daily.alucard.top stats.alucard.top;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        location / {
            if ($host ~* "alucard\.top$") {
                return 301 https://$host$request_uri;
            }
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        location /api/ {
            if ($host ~* "alucard\.top$") {
                return 301 https://$host$request_uri;
            }
            proxy_pass http://film:3601/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header New-Token;
            add_header New-Token $upstream_http_new_token always;
            add_header Access-Control-Expose-Headers "New-Token,new-token" always;
        }
    }

    # =========================
    # home：Web 前台 + /api 反代（SPA baseURL=/api）
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  home.alucard.top alucard.top www.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        # SPA axios baseURL=/api → film 去掉 /api 前缀
        location /api/ {
            proxy_pass http://film:3601/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header New-Token;
            add_header New-Token $upstream_http_new_token always;
            add_header Access-Control-Expose-Headers "New-Token,new-token" always;
        }

        location /proxy {
            proxy_pass http://172.19.0.1:3602;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 15s;
            add_header Access-Control-Allow-Origin * always;
        }

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }
    }

    # =========================
    # api：App 网关（根路径=片库 + 短路径）
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  api.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type text/plain;
        }

        location = /r {
            proxy_pass http://172.19.0.1:3605/r;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            client_max_body_size 20m;
            add_header Access-Control-Allow-Origin * always;
        }
        location = /d {
            proxy_pass http://172.19.0.1:3605/d;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            client_max_body_size 20m;
            add_header Access-Control-Allow-Origin * always;
        }
        location ^~ /f/ {
            proxy_pass http://172.19.0.1:3605;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            add_header Access-Control-Allow-Origin * always;
        }
        location = /health/r {
            proxy_pass http://172.19.0.1:3605/health/r;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin * always;
        }
        location = /e {
            proxy_pass http://172.19.0.1:3606/e;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Access-Control-Allow-Origin * always;
        }
        location ~ ^/t/([a-fA-F0-9]+)\.torrent$ {
            proxy_pass http://172.19.0.1:3603/app/magnet/$1.torrent;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            add_header Access-Control-Allow-Origin * always;
        }

        # 片库 API 根路径
        location ~ ^/(index|navCategory|filmDetail|filmPlayInfo|searchFilm|filmClassify|filmClassifySearch|config/) {
            proxy_pass http://film:3601;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header New-Token;
            add_header New-Token $upstream_http_new_token always;
            add_header Access-Control-Expose-Headers "New-Token,new-token" always;
        }

        # 旧 App 兼容
        location /api/ {
            proxy_pass http://film:3601/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header New-Token;
            add_header New-Token $upstream_http_new_token always;
            add_header Access-Control-Expose-Headers "New-Token,new-token" always;
        }

        location /proxy {
            proxy_pass http://172.19.0.1:3602;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 15s;
            add_header Access-Control-Allow-Origin * always;
        }

        location ^~ /app/magnet/ {
            proxy_pass http://172.19.0.1:3603;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            add_header Access-Control-Allow-Origin * always;
        }
        location ^~ /app/ytdlp/ {
            proxy_pass http://172.19.0.1:3605;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 600s;
            proxy_buffering off;
            client_max_body_size 20m;
            add_header Access-Control-Allow-Origin * always;
        }
        location ^~ /app/stats/ {
            proxy_pass http://172.19.0.1:3606;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
        }
        location ^~ /app/daily/ {
            proxy_pass http://172.19.0.1:3607;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Access-Control-Allow-Origin * always;
        }

        # 旧路径跳转
        location = /manage { return 301 https://admin.alucard.top/manage; }
        location /manage { return 301 https://admin.alucard.top$request_uri; }
        location /ops/     { return 301 https://ops.alucard.top/; }

        location / {
            return 302 https://home.alucard.top/;
        }
    }

    # =========================
    # admin：管理后台（SPA 路由 /manage/*，API 走 /api/*）
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  admin.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        # API 优先：/api/manage/* /api/login /api/index ...
        location /api/ {
            proxy_pass http://film:3601/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header New-Token;
            add_header New-Token $upstream_http_new_token always;
            add_header Access-Control-Expose-Headers "New-Token,new-token" always;
            client_max_body_size 50m;
        }

        location /proxy {
            proxy_pass http://172.19.0.1:3602;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 120s;
            add_header Access-Control-Allow-Origin * always;
        }

        # 根路径跳到 SPA 管理入口
        location = / {
            return 302 /manage;
        }

        # 前端路由 /manage /login /play 等
        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html;
        }
    }

    # =========================
    # ops：运营工具中心
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  ops.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            root /usr/share/nginx/html/ops;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # =========================
    # daily：每日登记
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  daily.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        # API 短路径优先
        location ~ ^/(health|list|preview|register|day)$ {
            proxy_pass http://172.19.0.1:3607;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            root /usr/share/nginx/html/daily;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # =========================
    # stats：统计看板
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  stats.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /summary {
            proxy_pass http://172.19.0.1:3606/summary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /get {
            proxy_pass http://172.19.0.1:3606/get;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /health {
            proxy_pass http://172.19.0.1:3606/health;
            proxy_set_header Host $host;
        }
        location / {
            root /usr/share/nginx/html/stats;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }

    # =========================
    # down：下载站
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  down.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            root /usr/share/nginx/html;
            try_files /download/index.html =404;
        }
        location = /get {
            proxy_pass http://172.19.0.1:3606/get;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        # 旧路径 301
        location /download/ { return 301 https://down.alucard.top/; }
        location /daily/    { return 301 https://daily.alucard.top/; }
        location /stats/    { return 301 https://stats.alucard.top/; }
        location /ads/      { return 301 https://ads.alucard.top/; }
        location /ops/      { return 301 https://ops.alucard.top/; }
        location = /v.json  { return 301 https://ota.alucard.top/v.json; }
        location /app/version.json { return 301 https://ota.alucard.top/v.json; }
        location ~ ^/app/(.+\.apk)$ {
            return 301 https://ota.alucard.top/$1;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /download/index.html;
        }
    }

    # =========================
    # ads：广告合作
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  ads.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            root /usr/share/nginx/html/ads;
            index index.html;
            try_files $uri /index.html;
        }
    }

    # =========================
    # ota：版本 + APK
    # =========================
    server {
        listen       443 ssl;
        http2        on;
        server_name  ota.alucard.top;

        ssl_certificate     /etc/letsencrypt/live/api.alucard.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.alucard.top/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /v.json {
            alias /usr/share/nginx/html/app/version.json;
            default_type application/json;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin * always;
        }
        location = /version.json {
            return 301 https://ota.alucard.top/v.json;
        }
        location = /latest.apk {
            alias /usr/share/nginx/html/app/latest.apk;
            default_type application/vnd.android.package-archive;
            add_header Access-Control-Allow-Origin * always;
        }
        location / {
            root /usr/share/nginx/html/app;
            try_files $uri =404;
            types { application/vnd.android.package-archive apk; }
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
