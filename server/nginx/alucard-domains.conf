# Alucard 子域名规划（完整档）
# 部署前：
#   1) DNS: home/down/ads/ota/api/admin/ops/daily/stats → 服务器 IP
#   2) 证书: *.alucard.top 或各子域单独证书
#   3) 按实际上游端口改 film / ytdlp / stats / daily
#   4) 旧路径保留 301，兼容旧书签与旧 App
#
# 对外不暴露：/api、/manage、/app/ytdlp 等长路径（仅内部 upstream 使用）

# ---------- 公共上游（按实际修改）----------
# film     :3601  GoFilm
# ytdlp    :3605
# stats    :3606
# daily    :（daily_update_api 端口，常见 3607 或脚本内 PORT）

# =========================
# home.alucard.top  Web 前台
# =========================
server {
    listen 443 ssl http2;
    server_name home.alucard.top;

    # ssl_certificate     /etc/ssl/alucard/fullchain.pem;
    # ssl_certificate_key /etc/ssl/alucard/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3601/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================
# api.alucard.top  App 网关
# 根路径 = 原 /api/ 片库接口
# 短路径: /r /d /f /t /e /health/r
# =========================
server {
    listen 443 ssl http2;
    server_name api.alucard.top;

    # --- 短路径网关 ---
    location = /r {
        proxy_pass http://127.0.0.1:3605/r;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /d {
        proxy_pass http://127.0.0.1:3605/d;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /f/ {
        proxy_pass http://127.0.0.1:3605/f/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /e {
        proxy_pass http://127.0.0.1:3606/e;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health/r {
        proxy_pass http://127.0.0.1:3605/health/r;
    }
    # 磁力代理：内部仍可指向 film /app/magnet/
    location ~ ^/t/([a-fA-F0-9]+)\.torrent$ {
        proxy_pass http://127.0.0.1:3601/app/magnet/$1.torrent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 兼容旧 App：仍可用 /api/*
    location /api/ {
        proxy_pass http://127.0.0.1:3601/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧路径 301 → 新子域
    location = /manage { return 301 https://admin.alucard.top/; }
    location /ops/     { return 301 https://ops.alucard.top/; }

    # 新默认：根路径即片库 API（原 /api/）
    location / {
        proxy_pass http://127.0.0.1:3601/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================
# admin.alucard.top  管理后台
# =========================
server {
    listen 443 ssl http2;
    server_name admin.alucard.top;

    location / {
        # 若 GoFilm 后台固定在 /manage，用 rewrite 去掉对外路径
        # 方式 A：后端已支持根路径托管 SPA
        # proxy_pass http://127.0.0.1:3601/;
        # 方式 B：反代到 /manage
        proxy_pass http://127.0.0.1:3601/manage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================
# ops.alucard.top  运营中心
# =========================
server {
    listen 443 ssl http2;
    server_name ops.alucard.top;

    root /opt/film/data/nginx/html/ops;
    index ops.html index.html;

    location / {
        try_files $uri $uri/ /ops.html;
    }
    # 也可：alias 到 static/ops.html
    # location = / { alias /opt/film/data/nginx/html/static/ops.html; }
}

# =========================
# daily.alucard.top
# =========================
server {
    listen 443 ssl http2;
    server_name daily.alucard.top;

    location / {
        proxy_pass http://127.0.0.1:3607/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================
# stats.alucard.top  看板 + /get 下载跳转
# =========================
server {
    listen 443 ssl http2;
    server_name stats.alucard.top;

    # 静态看板
    location = / {
        alias /opt/film/data/nginx/html/static/stats.html;
        default_type text/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3606/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =========================
# down.alucard.top  下载站
# =========================
server {
    listen 443 ssl http2;
    server_name down.alucard.top;

    root /opt/film/data/nginx/html/static;
    index download.html;

    location = / {
        try_files /download.html =404;
    }

    # 旧路径 301
    location /download/ { return 301 https://down.alucard.top/; }
    location /daily/    { return 301 https://daily.alucard.top/; }
    location /stats/    { return 301 https://stats.alucard.top/; }
    location /ads/      { return 301 https://ads.alucard.top/; }
    location /app/version.json { return 301 https://ota.alucard.top/v.json; }
    location ~ ^/app/(.+\.apk)$ {
        return 301 https://ota.alucard.top/$1;
    }
}

# =========================
# ads.alucard.top
# =========================
server {
    listen 443 ssl http2;
    server_name ads.alucard.top;

    location = / {
        alias /opt/film/data/nginx/html/static/ads.html;
        default_type text/html;
    }
}

# =========================
# ota.alucard.top  版本 + APK（可挂 CDN）
# =========================
server {
    listen 443 ssl http2;
    server_name ota.alucard.top;

    root /opt/film/data/nginx/html/app;
    # 目录内放 version.json 与 *.apk

    location = /v.json {
        alias /opt/film/data/nginx/html/app/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        return 301 https://ota.alucard.top/v.json;
    }
    location = /latest.apk {
        # 可改成具体文件或 try_files
        try_files /gofilm-latest.apk /Alucard-latest.apk =404;
    }
    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
}

# HTTP → HTTPS（可选）
server {
    listen 80;
    server_name
        home.alucard.top
        api.alucard.top
        admin.alucard.top
        ops.alucard.top
        daily.alucard.top
        stats.alucard.top
        down.alucard.top
        ads.alucard.top
        ota.alucard.top;
    return 301 https://$host$request_uri;
}
