<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alucard · 运营工具中心</title>
  <style>
    :root {
      --bg: #0b0b10; --card: #15151e; --accent: #f5c542; --text: #f2f2f5;
      --muted: #9a9aa8; --line: #2a2a36; --ok: #69f0ae; --err: #ff8a80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1000px 500px at 0% -10%, rgba(245,197,66,.12), transparent 55%), var(--bg);
      color: var(--text); min-height: 100vh;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
    .status-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .pill {
      font-size: 12px; border-radius: 999px; padding: 4px 10px;
      border: 1px solid var(--line); color: var(--muted); background: #12121a;
    }
    .pill.ok { color: var(--ok); border-color: #2a4a3a; }
    .pill.bad { color: var(--err); border-color: #5a3030; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px 18px; color: var(--muted); font-size: 14px; line-height: 1.7;
    }
    .card strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>运营工具中心</h1>
    <p class="sub">服务健康状态。各业务入口请在管理后台右下角「运营工具」打开。</p>
    <div class="status-row" id="statusRow"><span class="pill">检测中…</span></div>
    <div class="card">
      <strong>说明</strong><br />
      本页不展示业务直链，避免子页面暴露入口列表。<br />
      请从 <strong>管理后台</strong> 使用「运营工具」面板跳转每日登记、统计、下载站等。
    </div>
  </div>
  <script>
    const API = 'https://api.alucard.top';
    const DAILY = 'https://daily.alucard.top';
    const STATS = 'https://stats.alucard.top';
    async function check(name, url) {
      try {
        const r = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(), { mode: 'cors' });
        if (!r.ok) return { name, ok: false, detail: 'HTTP ' + r.status };
        const ct = r.headers.get('content-type') || '';
        if (ct.includes('json')) {
          const j = await r.json();
          return { name, ok: !!j.ok || j.code === 0 || j.service, detail: j.service || 'ok' };
        }
        return { name, ok: true, detail: 'ok' };
      } catch (e) {
        return { name, ok: false, detail: 'unreachable' };
      }
    }
    (async () => {
      const checks = await Promise.all([
        check('每日登记', DAILY + '/health'),
        check('用户统计', STATS + '/health'),
        check('解析', API + '/health/r'),
        check('片库', API + '/index'),
      ]);
      document.getElementById('statusRow').innerHTML = checks.map(c =>
        `<span class="pill ${c.ok ? 'ok' : 'bad'}">${c.name}: ${c.detail}</span>`
      ).join('');
    })();
  </script>
</body>
</html>
