<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Alucard影视 · 下载</title>
  <meta name="description" content="Alucard影视 Android 客户端下载" />
  <style>
    :root {
      --bg: #0b0b10;
      --card: #15151e;
      --accent: #f5c542;
      --text: #f2f2f5;
      --muted: #9a9aa8;
      --line: #2a2a36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(245,197,66,.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(120,90,255,.12), transparent 50%),
        var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(145deg, #f5c542, #c99410);
      display: grid; place-items: center;
      font-weight: 800; font-size: 28px; color: #1a1000;
      box-shadow: 0 12px 40px rgba(245,197,66,.25);
      margin-bottom: 18px;
    }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: .5px; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
    .card {
      background: rgba(21,21,30,.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; }
    .row span:first-child { color: var(--muted); }
    .btn {
      display: block; width: 100%;
      text-align: center; text-decoration: none;
      background: linear-gradient(180deg, #ffd666, #f5c542 40%, #d4a017);
      color: #1a1000; font-weight: 700; font-size: 17px;
      padding: 16px 18px; border-radius: 14px;
      border: none; cursor: pointer;
      box-shadow: 0 10px 28px rgba(245,197,66,.28);
      transition: transform .12s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn.secondary {
      margin-top: 10px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
      box-shadow: none;
      font-size: 14px;
      padding: 12px;
    }
    .tips { color: var(--muted); font-size: 13px; line-height: 1.7; margin-top: 18px; }
    .tips ol { padding-left: 18px; margin: 8px 0 0; }
    .foot { margin-top: 28px; color: #666; font-size: 12px; text-align: center; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      background: rgba(245,197,66,.15); color: var(--accent);
      padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
    }
    code { color: #e8d48b; word-break: break-all; font-size: 12px; }
    .foot a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">A</div>
    <div class="badge">Android · 自助分发</div>
    <h1>Alucard影视</h1>
    <p class="sub">影视浏览 · 链接下载 · 种子边下边播。点击下方按钮安装到手机。</p>

    <div class="card">
      <div class="row"><span>版本</span><span id="ver">加载中…</span></div>
      <div class="row"><span>更新说明</span><span id="log" style="text-align:right;max-width:62%">—</span></div>
      <div class="row"><span>下载地址</span><span style="text-align:right;max-width:62%"><code id="url">—</code></span></div>
    </div>

    <a class="btn" id="dl" href="/get?v=latest">立即下载 APK</a>
    <a class="btn secondary" href="/ads/">广告合作</a>

    <div class="tips">
      <strong style="color:#ccc">安装提示</strong>
      <ol>
        <li>用手机浏览器打开本页，点「立即下载」。</li>
        <li>若提示风险，选择「仍要下载 / 仍要安装」（自签分发包常见提示）。</li>
        <li>设置里允许「安装未知应用」对应浏览器权限。</li>
        <li>更新也可在 App 内「我的 → 检查更新」。</li>
      </ol>
    </div>

    <div class="foot">
      Alucard · 仅供自行分发使用
      · <a href="https://api.alucard.top/">Web 前台</a>
      · <a href="/ads/">广告合作</a>
    </div>
  </div>

  <script>
    // 同域短路径（DNS 未齐前可用；ota 子域就绪后仍兼容）
    const VER = '/v.json';
    const GET = '/get';

    (async function () {
      try {
        const r = await fetch(VER + '?_=' + Date.now(), { cache: 'no-store' });
        const j = await r.json();
        const name = j.versionName || '?';
        const code = j.versionCode || '';
        document.getElementById('ver').textContent = 'v' + name + (code ? ' (' + code + ')' : '');
        document.getElementById('log').textContent = j.changelog || '—';
        const apk = j.apkUrl || j.downloadUrl || '/app/latest.apk';
        document.getElementById('url').textContent = apk || '—';
        const btn = document.getElementById('dl');
        btn.href = GET + '?v=latest&t=' + Date.now();
        btn.addEventListener('click', function () {
          setTimeout(function () {
            if (apk) location.href = apk;
          }, 2500);
        });
      } catch (e) {
        document.getElementById('ver').textContent = '读取版本失败';
      }
    })();
  </script>
</body>
</html>
